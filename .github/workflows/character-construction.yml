name: Character construction gates
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  character-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo install -d -m 1777 /private/tmp
      - run: python -m pip install -r tools/characters/requirements.txt
      - run: python -m unittest discover -s tools/characters/tests
      - run: python tools/characters/check.py
      - run: python tools/characters/godot_integration.py verify-runtime godot2d/assets/characters/integrations/adult-v4-tank-visible-r001/manifest.json
