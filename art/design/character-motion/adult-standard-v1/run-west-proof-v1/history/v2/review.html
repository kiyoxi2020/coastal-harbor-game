<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>西向跑步小样与走跑切换</title>
<style>body{font:16px system-ui;background:#202830;color:#eee;margin:24px}button,select{font:inherit;padding:8px;margin:6px}canvas{image-rendering:pixelated;background:#e5e0d2}section{display:flex;gap:28px;flex-wrap:wrap}a{color:#a4d7ff}small{color:#c0c8ce}</style>
<h1>西向跑步小样 · 待评审</h1><p>同一母版／奶油短袖／固定裤鞋。走路54，跑步候选81世界单位/秒；75%播放速度。</p>
<button id="play">暂停</button><button id="step">下一帧</button><button id="switch">切换中间角色 walk → run</button><button id="bg">明暗背景</button>
<label>显示 <select id="scale"><option value="1">原生渲染尺度</option><option value="2" selected>放大2倍</option><option value="4">放大4倍</option></select></label>
<section><div><p>已认可 walk</p><canvas id="walk"></canvas></div><div><p id="selected">切换预览：walk</p><canvas id="transition"></canvas></div><div><p>run 候选</p><canvas id="run"></canvas></div></section><p id="state"></p>
<p><a href="launch-game-trial.command">启动港口走跑试玩（macOS）</a>：A / 左箭头行走，按住Shift西向跑步，松开停步，R回位。</p>
<p>本轮为完整帧动作小样，尚未拆分run衣身/袖子；不表示动态换装或正式发布通过。第0/2帧为交替接触候选，第1/3帧为腾空候选。相位与完整关节轨迹尚待冻结。</p><small id="digest"></small>
<script>const clips={"walk": [{"file": "../locomotion-v1/baked/A_8.png", "duration_ms": 80}, {"file": "../locomotion-v1/baked/A_9.png", "duration_ms": 80}, {"file": "../locomotion-v1/baked/A_10.png", "duration_ms": 80}, {"file": "../locomotion-v1/baked/A_11.png", "duration_ms": 80}], "run": [{"file": "registered/run_west_0.png", "duration_ms": 80}, {"file": "registered/run_west_1.png", "duration_ms": 80}, {"file": "registered/run_west_2.png", "duration_ms": 80}, {"file": "registered/run_west_3.png", "duration_ms": 80}]},digest="e8494665f1cdb153f13dce05ddd09bf4c1b615b3cfbbe1f41d60a5d9f6bde887";
const images={};for(const key in clips)images[key]=clips[key].map(f=>{let im=new Image();im.src=f.file;return im});
let elapsed=0,playing=true,last=performance.now(),selected='walk',dark=false;
const byId=id=>document.getElementById(id);
function pose(key,t){let total=clips[key].reduce((s,f)=>s+f.duration_ms,0);t=t%total;for(let i=0;i<clips[key].length;i++){if(t<clips[key][i].duration_ms)return [i,t/clips[key][i].duration_ms];t-=clips[key][i].duration_ms}return [0,0]}
function render(id,key,t){let c=byId(id),ctx=c.getContext('2d'),index=pose(key,t)[0];ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;let im=images[key][index];if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,c.width,c.height);return index}
function resize(){for(const id of ['walk','transition','run']){byId(id).width=Math.round(512*138/582*Number(byId('scale').value));byId(id).height=Math.round(768*138/582*Number(byId('scale').value))}}
function draw(now){if(playing)elapsed+=(now-last)*.75;last=now;render('walk','walk',elapsed);render('run','run',elapsed);let i=render('transition',selected,elapsed);byId('state').textContent=selected+' · 姿态'+i+' · '+(clips[selected][i].duration_ms/.75).toFixed(1)+' ms/帧';requestAnimationFrame(draw)}
byId('switch').onclick=()=>{let [i,fraction]=pose(selected,elapsed);selected=selected==='walk'?'run':'walk';elapsed=clips[selected].slice(0,i).reduce((s,f)=>s+f.duration_ms,0)+fraction*clips[selected][i].duration_ms;byId('selected').textContent='切换预览：'+selected;byId('switch').textContent='切换中间角色 '+selected+' → '+(selected==='walk'?'run':'walk')};
byId('play').onclick=()=>{playing=!playing;byId('play').textContent=playing?'暂停':'播放'};
byId('step').onclick=()=>{playing=false;byId('play').textContent='播放';let i=(pose(selected,elapsed)[0]+1)%clips[selected].length;elapsed=clips[selected].slice(0,i).reduce((s,f)=>s+f.duration_ms,0)};
byId('bg').onclick=()=>{dark=!dark;for(const id of ['walk','transition','run'])byId(id).style.background=dark?'#15202b':'#e5e0d2'};
byId('scale').onchange=resize;byId('digest').textContent='候选清单 SHA256 '+digest;resize();requestAnimationFrame(draw);
</script></html>
